<html>
<head>
  <title>Contact Us - Cafe</title>
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="aboutus.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
  <div class="container">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Whether it’s feedback, queries, or just a hello — send us a message.</p>
    
    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
  </main>
<footer style="background-color: #333; color: white; text-align: center;">
    
    <a href="https://www.facebook.com" style="margin: 0 20px; color: white; font-size: 24px;"><i class="fab fa-facebook-f"></i></a>
    <a href="https://www.instagram.com" style="margin: 0 20px; color: white; font-size: 24px;"><i class="fab fa-instagram"></i></a>
    <a href="https://www.twitter.com" style="margin: 0 20px; color: white; font-size: 24px;"><i class="fab fa-twitter"></i></a>
    <p style="margin-top: 20px; font-size: 18px;">&copy; 2025 Cafess. All rights reserved.</p>
  </footer>

</body>
</html>
